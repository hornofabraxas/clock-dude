name: ci

# Build gate on every push to main and every pull request: runs the host rule
# tests, compiles both watch targets, and enforces the app-image ceiling, so a
# tree that does not build or whose rules have regressed cannot land on main.
#
# The build steps live in the .github/actions/pebble-build composite action,
# shared with release.yml.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build Clock Dude
        uses: ./.github/actions/pebble-build
